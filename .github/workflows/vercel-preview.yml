name: Vercel Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    # Scoped to this job (not workflow-level) so the Vercel identifiers aren't
    # exposed to every job — required by the vercel pull/build/deploy steps below
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Wait for Supabase branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Waiting for Supabase branch '$BRANCH_NAME' to be ready..."
          for i in $(seq 1 60); do
            RESPONSE=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/branches")
            STATUS=$(echo "$RESPONSE" | jq -r --arg branch "$BRANCH_NAME" '.[] | select(.git_branch == $branch) | .status')
            echo "Attempt $i/60: status=$STATUS"
            if [ "$STATUS" = "ACTIVE_HEALTHY" ] || [ "$STATUS" = "FUNCTIONS_DEPLOYED" ]; then
              echo "Supabase branch is ready!"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for Supabase branch after 10 minutes"
          exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          # Pinned (not `latest`) to avoid the release-resolution endpoint 504
          version: 2.107.0

      - name: Get Supabase branch DB credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          supabase --experimental branches get "$BRANCH_NAME" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            -o env >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Inject DB env vars for build
        run: |
          ENV_FILE=".vercel/.env.preview.local"
          # Use transaction-mode pooler for general queries
          echo "DATABASE_URL=$POSTGRES_URL" >> "$ENV_FILE"
          # Derive session-mode pooler URL (port 5432) for migrations (supports advisory locks, reachable over IPv4)
          SESSION_URL=$(echo "$POSTGRES_URL" | sed 's/:6543/:5432/')
          echo "DIRECT_URL=$SESSION_URL" >> "$ENV_FILE"
          echo "Injected DATABASE_URL (pooler:6543) and DIRECT_URL (session:5432)"

      - name: Build (with retry for cold DB)
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt/3..."
            if vercel build --token=${{ secrets.VERCEL_TOKEN }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed, waiting 15s before retry..."
              sleep 15
            fi
          done
          echo "All build attempts failed"
          exit 1

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Comment PR with preview URL
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview_url }}';
            const body = `### Preview Deployment\n\n**Preview:** ${url}\n\nDeployed with Supabase branch database.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('### Preview Deployment'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Report preview URL to treck.dev
        if: steps.deploy.outputs.preview_url
        env:
          TRECK_API_SECRET: ${{ secrets.TRECK_API_SECRET }}
        run: |
          if [ -z "$TRECK_API_SECRET" ]; then exit 0; fi
          curl -s -X POST "https://www.treck.dev/api/ci/preview-ready" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TRECK_API_SECRET" \
            -d "{\"repo\":\"$GITHUB_REPOSITORY\",\"prNumber\":${{ github.event.pull_request.number }},\"headSha\":\"${{ github.event.pull_request.head.sha }}\",\"previewUrl\":\"${{ steps.deploy.outputs.preview_url }}\"}"
          echo ""
          echo "Preview URL reported to treck.dev"
