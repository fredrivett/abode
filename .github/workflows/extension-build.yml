name: Extension Build

# Builds the browser extension and uploads the unpacked output as an artifact so
# anyone can grab the latest `main` build without a local toolchain: Actions →
# this workflow → latest run → download `abode-extension-chrome` → unzip → load
# unpacked at chrome://extensions. The extension is NOT published to a store, so
# this is how "run the latest" works between (eventual) store releases.

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-build.yml"
  workflow_dispatch:

concurrency:
  group: extension-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./extension
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-extension-${{ hashFiles('extension/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-extension-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run compile

      - name: Unit tests
        run: bun run test

      # The prod build (→ https://www.abode.fyi) bakes in the PUBLIC Supabase URL
      # + anon key. Both are derived from secrets that already exist — no extra
      # config to set:
      #   URL      = https://<SUPABASE_PROJECT_REF>.supabase.co
      #   anon key = fetched from the Supabase Management API with SUPABASE_ACCESS_TOKEN
      # (the anon key is public — the same one the web app ships; never the
      # service-role key.) Fork PRs have no secrets, so there we just skip the
      # build rather than fail; typecheck + tests above always run.
      - name: Resolve production env
        id: env
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "::error::SUPABASE_PROJECT_REF / SUPABASE_ACCESS_TOKEN secrets are unavailable." >&2
              exit 1
            fi
            echo "::notice::Supabase secrets unavailable (fork PR?) — skipping the extension build+upload."
            exit 0
          fi
          ANON_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          if [ -z "$ANON_KEY" ] || [ "$ANON_KEY" = "null" ]; then
            echo "::error::Could not fetch the anon key from the Supabase Management API." >&2
            exit 1
          fi
          echo "::add-mask::$ANON_KEY"
          {
            echo "WXT_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co"
            echo "WXT_SUPABASE_ANON_KEY=$ANON_KEY"
          } > .env.production
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build (production → abode.fyi)
        if: steps.env.outputs.configured == 'true'
        run: bun run build

      - name: Upload unpacked extension
        if: steps.env.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abode-extension-chrome
          path: extension/.output/chrome-mv3
          if-no-files-found: error

      # Only when an artifact was actually built+uploaded. Omitting a status
      # function means this implicitly ANDs with success(), so it's skipped on a
      # build failure too — never point people at a nonexistent artifact.
      - name: Summarise how to load it
        if: steps.env.outputs.configured == 'true'
        shell: bash
        run: |
          {
            echo '### abode extension build'
            echo ''
            echo 'Download the **abode-extension-chrome** artifact from this run, unzip it, then:'
            echo ''
            echo '1. Open `chrome://extensions`'
            echo '2. Toggle **Developer mode** (top-right)'
            echo '3. **Load unpacked** → select the unzipped folder'
            echo ''
            echo 'Targets production (`https://www.abode.fyi`). Load-unpacked does not auto-update — re-download after a new build.'
          } >> "$GITHUB_STEP_SUMMARY"
