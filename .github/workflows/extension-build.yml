name: Extension Build

# Builds the browser extension and uploads the unpacked output as an artifact so
# anyone can grab the latest `main` build without a local toolchain: Actions →
# this workflow → latest run → download `abode-extension-chrome` → unzip → load
# unpacked at chrome://extensions. The extension is NOT published to a store, so
# this is how "run the latest" works between (eventual) store releases.

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/extension-build.yml"
  workflow_dispatch:

concurrency:
  group: extension-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./extension
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.5"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-extension-${{ hashFiles('extension/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-extension-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run compile

      - name: Unit tests
        run: bun run test

      # Prod build targets https://www.abode.fyi. WXT reads WXT_-prefixed vars
      # from .env.production; these are the PUBLIC Supabase URL + anon key the web
      # app already ships (never the service-role key). Sourced from repo
      # variables so nothing sensitive lands in git — set them under
      # Settings → Secrets and variables → Actions → Variables.
      - name: Write production env
        env:
          WXT_SUPABASE_URL: ${{ vars.WXT_SUPABASE_URL }}
          WXT_SUPABASE_ANON_KEY: ${{ vars.WXT_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$WXT_SUPABASE_ANON_KEY" ] || [ -z "$WXT_SUPABASE_URL" ]; then
            echo "::error::Set the WXT_SUPABASE_URL and WXT_SUPABASE_ANON_KEY repository variables (Settings → Secrets and variables → Actions → Variables). They are the public anon values the web app already ships; without them the build produces an unconfigured extension." >&2
            exit 1
          fi
          {
            echo "WXT_SUPABASE_URL=$WXT_SUPABASE_URL"
            echo "WXT_SUPABASE_ANON_KEY=$WXT_SUPABASE_ANON_KEY"
          } > .env.production

      - name: Build (production → abode.fyi)
        run: bun run build

      - name: Upload unpacked extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abode-extension-chrome
          path: extension/.output/chrome-mv3
          if-no-files-found: error

      - name: Summarise how to load it
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo '### abode extension build'
            echo ''
            echo 'Download the **abode-extension-chrome** artifact from this run, unzip it, then:'
            echo ''
            echo '1. Open `chrome://extensions`'
            echo '2. Toggle **Developer mode** (top-right)'
            echo '3. **Load unpacked** → select the unzipped folder'
            echo ''
            echo 'Targets production (`https://www.abode.fyi`). Load-unpacked does not auto-update — re-download after a new build.'
          } >> "$GITHUB_STEP_SUMMARY"
