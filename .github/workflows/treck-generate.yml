# Generated by treck init — generates tests when triggered from treck.dev dashboard
# Learn more: https://www.treck.dev

name: treck generate
on:
  repository_dispatch:
    types: [treck-generate]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.client_payload.pr_number }}/head
          fetch-depth: 0

      - name: Detect default branch
        id: default-branch
        run: |
          echo "branch=$(git remote show origin | sed -n 's/.*HEAD branch: //p')" >> "$GITHUB_OUTPUT"

      - name: Fetch default branch
        run: git fetch origin ${{ steps.default-branch.outputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate tests
        run: npx --yes treck@latest test --generate --base ${{ steps.default-branch.outputs.branch }} --flows "${{ github.event.client_payload.flows }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit generated tests
        run: |
          git config user.name "treck[bot]"
          git config user.email "bot@treck.dev"
          git add -A
          git commit -m "test: generate treck tests" || true
          git push
