# Generated by treck init — generates tests when triggered from treck.dev dashboard
# Learn more: https://github.com/fredrivett/treck

name: treck generate
on:
  repository_dispatch:
    types: [treck-generate]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.client_payload.pr_number }}/head

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate tests
        run: npx --yes treck@latest test --generate --flows "${{ github.event.client_payload.flows }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit generated tests
        run: |
          git config user.name "treck[bot]"
          git config user.email "bot@treck.dev"
          git add -A
          git commit -m "test: generate treck tests" || true
          git push
