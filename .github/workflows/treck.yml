# Generated by treck init — posts impact summaries on PRs
# Learn more: https://github.com/fredrivett/treck

name: treck
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get treck version
        id: version
        run: echo "version=$(npx --yes treck@latest --version)" >> "$GITHUB_OUTPUT"

      - name: Generate diff
        id: diff
        run: npx --yes treck@latest diff --base origin/${{ github.event.pull_request.base.ref }} --format json > diff.json

      - name: Check flow test coverage
        id: test-check
        run: npx --yes treck@latest test --check --base origin/${{ github.event.pull_request.base.ref }} --format json > test-check.json
        continue-on-error: true

      - name: Report coverage to treck.dev
        if: always()
        env:
          TRECK_API_SECRET: ${{ secrets.TRECK_API_SECRET }}
        run: |
          node -e "
            const fs = require('fs');
            if (!process.env.TRECK_API_SECRET) process.exit(0);
            let coverage;
            try { coverage = JSON.parse(fs.readFileSync('test-check.json', 'utf8')); } catch { process.exit(0); }
            const body = JSON.stringify({
              repo: process.env.GITHUB_REPOSITORY,
              prNumber: ${{ github.event.pull_request.number }},
              headSha: '${{ github.event.pull_request.head.sha }}',
              coverage,
            });
            fetch('https://www.treck.dev/api/ci/report', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + process.env.TRECK_API_SECRET },
              body,
            }).then(r => { if (!r.ok) throw new Error('Status ' + r.status); console.log('Coverage reported to treck.dev'); })
              .catch(e => { console.error('Report failed:', e.message); process.exit(1); });
          "

      # Preview URL reporting moved to vercel-preview.yml workflow

      - name: Post comment
        uses: actions/github-script@v7
        env:
          TRECK_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const diff = JSON.parse(fs.readFileSync('diff.json', 'utf8'));

            const modified = diff.changes.modified.length;
            const added = diff.changes.added.length;
            const removed = diff.changes.removed.length;

            if (modified === 0 && added === 0 && removed === 0) {
              return; // No changes, no comment
            }

            const lines = [
              `**${modified} symbols changed**, ${added} added, ${removed} removed`,
            ];

            const entryNodes = diff.nodes.filter(n => n.entryType);
            if (entryNodes.length > 0) {
              const typeLabels = {
                'api-route': 'API Routes',
                'page': 'Pages',
                'server-action': 'Server Actions',
                'trigger-task': 'Trigger Tasks',
                'trigger-scheduled-task': 'Scheduled Tasks',
                'inngest-function': 'Inngest Functions',
                'middleware': 'Middleware',
              };

              const groups = {};
              for (const node of entryNodes) {
                const group = typeLabels[node.entryType] || node.entryType;
                if (!groups[group]) groups[group] = [];
                const method = node.metadata?.httpMethod ?? '';
                const route = node.metadata?.route ?? '';
                const label = method && route ? `${method} ${route}` : node.name || node.id;
                groups[group].push(label);
              }

              lines.push('');
              lines.push(`**${entryNodes.length} entry points affected:**`);
              for (const [group, items] of Object.entries(groups)) {
                const list = items.map(i => `- \`${i}\``).join('\n');
                lines.push(`<details><summary>${group} (${items.length})</summary>\n\n${list}\n</details>`);
              }
            } else {
              lines.push('No entry points affected');
            }

            lines.push('');
            lines.push(`Impact: ${diff.impact.totalUpstream} upstream callers, ${diff.impact.totalDownstream} downstream callees`);

            // Append test coverage section if available
            try {
              const testData = JSON.parse(fs.readFileSync('test-check.json', 'utf8'));
              if (testData.total > 0) {
                lines.push('');
                lines.push('### Test coverage');
                lines.push('');
                for (const flow of testData.flows) {
                  const icon = flow.status === 'covered' ? '✅' : flow.status === 'stale' ? '⚠️' : '❌';
                  lines.push(`${icon} \`${flow.label}\` — ${flow.status}`);
                }
                lines.push('');
                lines.push(`**${testData.covered}/${testData.total} covered**`);
              }
            } catch {
              // test-check.json may not exist if the step failed
            }

            const version = process.env.TRECK_VERSION || 'unknown';
            const timestamp = new Date().toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC');

            lines.push('');
            lines.push('---');
            lines.push(`_treck v${version} · ${timestamp}_`);

            const body = `## treck impact\n_Functions and entry points affected by this PR._\n\n${lines.join('\n')}`;

            console.log(body);

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('## treck impact'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

